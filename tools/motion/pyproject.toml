[project]
name = "despamo-motion-extractor"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.0.1",
  "transformers==4.32.0",
  "numpy==1.26.4",
  "pillow==11.3.0",
  "safetensors==0.8.0",
  "huggingface-hub==0.36.2",
  "pydantic==2.13.5",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
